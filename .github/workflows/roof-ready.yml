name: Build Roof Full Local

on:
  push:
    branches: [roof-full-local]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20 for full Roof Web
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare full TWeb-compatible sources
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _build
          mkdir -p _build
          git clone --depth 1 https://github.com/teamgram/teamgram-server.git _build/roof-server
          git clone --depth 1 --branch teamgram https://github.com/teamgram/teamgram-tweb.git _build/roof-tweb
          printf 'data/\n.git/\n' > _build/roof-server/.dockerignore
          find _build/roof-server -type f -name '*.sh' -exec sed -i 's/\r$//' {} +

      - name: Force Roof Web to use only the local server
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dc = Path('_build/roof-tweb/src/lib/mtproto/dcConfigurator.ts')
          text = dc.read_text(encoding='utf-8')
          old = "  const chosenServer = `wss://web.teamgram.net/${path}`;"
          new = "  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';\n  const chosenServer = `${protocol}://${location.host}/${path}`;"
          if old not in text:
              raise SystemExit('Expected remote WebSocket endpoint was not found')
          dc.write_text(text.replace(old, new, 1), encoding='utf-8')

          env_path = Path('_build/roof-tweb/.env')
          lines = env_path.read_text(encoding='utf-8').splitlines()
          overrides = {
              'VITE_MTPROTO_HTTP': '',
              'VITE_MTPROTO_AUTO': '',
              'VITE_MTPROTO_HAS_HTTP': '',
              'VITE_MTPROTO_HAS_WS': '1',
          }
          seen = set()
          out = []
          for line in lines:
              if '=' not in line:
                  out.append(line)
                  continue
              key, _ = line.split('=', 1)
              if key in overrides:
                  out.append(f'{key}={overrides[key]}')
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in overrides.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          env_path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          grep -F "\${protocol}://\${location.host}/\${path}" _build/roof-tweb/src/lib/mtproto/dcConfigurator.ts
          ! grep -F 'wss://web.teamgram.net/${path}' _build/roof-tweb/src/lib/mtproto/dcConfigurator.ts

      - name: Build local Roof protocol server image
        shell: bash
        run: |
          set -euxo pipefail
          docker build -t roof-teamgram:ready _build/roof-server

      - name: Build local Roof Stars and Premium service
        shell: bash
        run: |
          set -euxo pipefail
          docker build -t roof-wallet:ready roof-ready/wallet

      - name: Build full Roof Web client
        shell: bash
        run: |
          set -euxo pipefail
          cd _build/roof-tweb
          corepack enable
          corepack prepare pnpm@8.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm run generate-changelog
          node build
          cd ../..
          rm -rf roof-ready/web
          mkdir -p roof-ready/web
          cp -a _build/roof-tweb/public/. roof-ready/web/
          python3 - <<'PY'
          from pathlib import Path
          root = Path('roof-ready/web')
          text_exts = {'.html', '.json', '.webmanifest', '.txt', '.xml', '.js', '.css'}
          replacements = (
              ('Telegram Web K', 'Roof'),
              ('Telegram Web', 'Roof'),
              ('Teamgram Web', 'Roof'),
              ('<title>Telegram</title>', '<title>Roof</title>'),
          )
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Add local server runtime configs
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf roof-ready/teamgramd
          cp -a _build/roof-server/teamgramd roof-ready/teamgramd
          rm -rf roof-ready/teamgramd/bin || true

      - name: Save prebuilt local Docker images
        shell: bash
        run: |
          set -euxo pipefail
          docker save roof-teamgram:ready roof-wallet:ready | gzip -1 > roof-ready/roof-images.tar.gz

      - name: Add local test instructions
        shell: bash
        run: |
          cat > roof-ready/README_READY.txt <<'EOF'
          ROOF FULL LOCAL
          ===============
          This package is for LOCAL testing before buying a domain or deploying a server.

          1. Install and start Docker Desktop.
          2. Run START_ROOF.bat.
          3. Open http://localhost:8080
          4. Roof Store: http://localhost:8787/store/

          The web client is the full TWeb-style interface and is forced to connect to the local stack.
          It does not connect to the official Telegram network.

          Current local protocol engine is based on the open-source Teamgram community server.
          We will extend/replace missing server-side feature families for Roof after local UI testing.
          EOF

      - name: Validate full local package
        shell: bash
        run: |
          set -euxo pipefail
          test -s roof-ready/roof-images.tar.gz
          test -f roof-ready/web/index.html
          test -d roof-ready/teamgramd/deploy/sql
          test -f roof-ready/docker-compose.yml
          test -f roof-ready/nginx.conf
          test -f roof-ready/START_ROOF.bat
          grep -F 'roof-images.tar.gz' roof-ready/START_ROOF.bat
          ! grep -R -F 'wss://web.teamgram.net' roof-ready/web
          du -sh roof-ready

      - name: Zip Roof Full Local
        shell: bash
        run: |
          set -euxo pipefail
          cd roof-ready
          zip -r -9 ../Roof-Full-Local.zip .

      - name: Upload Roof Full Local artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roof-Full-Local
          path: Roof-Full-Local.zip
          compression-level: 0
          retention-days: 14

name: Roof Own TWeb CI

on:
  push:
    branches: [roof-own-tweb]
  workflow_dispatch:

concurrency:
  group: roof-own-tweb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: backend
        run: uv sync --extra dev
      - working-directory: backend
        run: uv run ruff check app create_admin.py tests
      - working-directory: backend
        run: uv run pytest -q tests

  tweb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Fetch pinned TWeb UI source
        run: |
          git clone --filter=blob:none https://github.com/morethanwords/tweb.git _build/tweb
          cd _build/tweb
          git checkout e3730e10073c3fc02e1360e3513b70b176d6afec
      - name: Apply Roof transport, Premium UI and safe branding
        run: python3 roof-tweb/patch_tweb_safe.py _build/tweb
      - name: Verify Roof patch invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'web\.telegram\.org|web\.teamgram\.net|149\.154\.(167|171|175)\.' _build/tweb/src/lib/mtproto/dcConfigurator.ts
          ! grep -n 'cachedNetworker.wrapApiCall(method, params, options)' _build/tweb/src/lib/appManagers/apiManager.ts
          grep -n 'roofTransport.invoke' _build/tweb/src/lib/appManagers/apiManager.ts
          grep -n 'ROOF_MTPROTO_DISABLED' _build/tweb/src/lib/mtproto/dcConfigurator.ts
          grep -n "'Telegram.LanguageViewController'" _build/tweb/src/lang.ts
          grep -n "'Telegram.GeneralSettingsViewController'" _build/tweb/src/lang.ts
          grep -n "'MenuTelegramStars'" _build/tweb/src/lang.ts
          grep -n 'Roof Premium' _build/tweb/src/components/sidebarLeft/tabs/settings.tsx
          grep -n 'Roof Stars' _build/tweb/src/components/sidebarLeft/tabs/settings.tsx
          grep -n 'roof.updateEmojiStatus' _build/tweb/src/components/sidebarLeft/tabs/editProfile.tsx
      - name: Build full Roof Web client
        working-directory: _build/tweb
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify Roof entry point
        run: |
          test -f _build/tweb/dist/index.html
          grep -qi 'Roof' _build/tweb/dist/index.html

  docker-smoke:
    needs: [backend, tweb]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start complete Roof stack
        run: |
          mkdir -p roof-package/premium-emoji-packs
          docker compose -f roof-tweb/docker-compose.yml up --build -d
      - name: Wait for Roof web
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/tmp/roof-index.html; then exit 0; fi
            sleep 2
          done
          docker compose -f roof-tweb/docker-compose.yml logs
          exit 1
      - name: Verify Roof UI and own API proxy
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'Roof' /tmp/roof-index.html
          grep -q '/roof-ui.css' /tmp/roof-index.html
          curl -fsS http://127.0.0.1:8080/roof-ui.css >/tmp/roof-ui.css
          grep -q 'tgico-search' /tmp/roof-ui.css
          grep -q 'roof-premium-card' /tmp/roof-ui.css
          grep -q 'Segoe UI Emoji' /tmp/roof-ui.css
          EMAIL="ci-$GITHUB_RUN_ID@example.com"
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"roofpass123\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['access_token']; assert d['user']['email'].startswith('ci-')"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f roof-tweb/docker-compose.yml logs
      - name: Stop Roof stack
        if: always()
        run: docker compose -f roof-tweb/docker-compose.yml down -v

  package:
    needs: [docker-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build final Roof Docker images
        run: docker compose -f roof-tweb/docker-compose.yml build
      - name: Verify final web image contains Roof UI layer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh roof-web:local -c "test -s /usr/share/nginx/html/roof-ui.css && grep -q tgico-search /usr/share/nginx/html/roof-ui.css && grep -q roof-premium-card /usr/share/nginx/html/roof-ui.css && grep -q /roof-ui.css /usr/share/nginx/html/index.html"
      - name: Create offline Roof package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _package/Roof-Full-Local/premium-emoji-packs
          docker save roof-backend:local roof-web:local -o _package/Roof-Full-Local/roof-images.tar
          cp roof-package/docker-compose.yml _package/Roof-Full-Local/docker-compose.yml
          cp roof-package/RUN_ROOF.bat _package/Roof-Full-Local/RUN_ROOF.bat
          cp roof-package/STOP_ROOF.bat _package/Roof-Full-Local/STOP_ROOF.bat
          printf '%s\n' 'Roof Premium Emoji Packs' '' 'Put collection ZIP files directly into this folder. Do not unpack them.' 'Supported format: ZIP containing .tgs animated emoji files.' 'Restart RUN_ROOF.bat after adding a collection.' > _package/Roof-Full-Local/premium-emoji-packs/README.txt
          printf 'Roof Full Local\nCommit: %s\nNetwork: Roof only\nStart: RUN_ROOF.bat\nURL: http://localhost:8080\nPremium emoji packs: premium-emoji-packs\\ (ZIP with .tgs files; do not unpack)\n' "$GITHUB_SHA" > _package/Roof-Full-Local/README.txt
          test -f _package/Roof-Full-Local/premium-emoji-packs/README.txt
          du -sh _package/Roof-Full-Local
      - name: Upload Roof Full Local
        uses: actions/upload-artifact@v4
        with:
          name: Roof-Full-Local
          path: _package/Roof-Full-Local
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

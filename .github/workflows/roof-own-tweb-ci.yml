name: Roof Own TWeb CI

on:
  push:
    branches: [roof-own-tweb]
  workflow_dispatch:

concurrency:
  group: roof-own-tweb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: backend
        run: uv sync --extra dev
      - working-directory: backend
        run: uv run ruff check app create_admin.py tests
      - working-directory: backend
        run: uv run pytest -q tests

  tweb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Fetch pinned TWeb UI source
        run: |
          git clone --filter=blob:none https://github.com/morethanwords/tweb.git _build/tweb
          cd _build/tweb
          git checkout e3730e10073c3fc02e1360e3513b70b176d6afec
      - name: Apply Roof-only transport and email auth
        run: python3 roof-tweb/patch_tweb.py _build/tweb
      - name: Verify no Telegram or Teamgram network endpoint
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'web\.telegram\.org|web\.teamgram\.net|149\.154\.(167|171|175)\.' \
            _build/tweb/src/lib/mtproto/dcConfigurator.ts
          ! grep -n 'cachedNetworker.wrapApiCall(method, params, options)' \
            _build/tweb/src/lib/appManagers/apiManager.ts
          grep -n 'roofTransport.invoke' _build/tweb/src/lib/appManagers/apiManager.ts
          grep -n 'ROOF_MTPROTO_DISABLED' _build/tweb/src/lib/mtproto/dcConfigurator.ts
      - name: Build full Roof Web client
        working-directory: _build/tweb
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify Roof entry point
        run: |
          test -f _build/tweb/dist/index.html
          grep -qi 'Roof' _build/tweb/dist/index.html

  docker-smoke:
    needs: [backend, tweb]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start complete Roof stack
        run: docker compose -f roof-tweb/docker-compose.yml up --build -d
      - name: Wait for Roof web
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/tmp/roof-index.html; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f roof-tweb/docker-compose.yml logs
          exit 1
      - name: Verify Roof UI and own API proxy
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'Roof' /tmp/roof-index.html
          EMAIL="ci-$GITHUB_RUN_ID@example.com"
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"roofpass123\"}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['access_token']; assert d['user']['email'].startswith('ci-')"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f roof-tweb/docker-compose.yml logs
      - name: Stop Roof stack
        if: always()
        run: docker compose -f roof-tweb/docker-compose.yml down -v
